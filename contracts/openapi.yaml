  /migrations/android-bindings/commit:
    post:
      tags: [Migrations]
      operationId: commitAndroidBindingMigration
      summary: Atomically commit a previously previewed Android binding migration.
      description: |
        The request must repeat the exact normalized preview input and token.
        selected_duplicate_keys may choose at most one DUPLICATE_LEGACY_TAG
        record per tag. The server takes a SQLite BEGIN IMMEDIATE lock,
        recomputes the preview, and returns 409 MIGRATION_PREVIEW_STALE before
        any write when relevant authoritative state differs. Products, tags,
        MIGRATION bindings, audits, and the idempotency response commit once.
      security:
        - AndroidBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AndroidBindingMigrationCommitRequest"
      responses:
        "200":
          description: Migration committed, or the exact stored idempotent response replayed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AndroidBindingMigrationCommit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
