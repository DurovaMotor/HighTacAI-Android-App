    post:
      tags: [Migrations]
      operationId: previewAndroidBindingMigration
      summary: Classify normalized legacy Android bindings without writing data.
      description: |
        The response token is stateless and integrity-protected. It is bound to
        the approved Android device, the exact ordered normalized records, and
        the authoritative station, tag, product, and active-binding state that
        can affect migration. Preview never changes database state.
      security:
        - AndroidBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AndroidBindingMigrationPreviewRequest"
      responses:
        "200":
          description: Stateless migration preview.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AndroidBindingMigrationPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
