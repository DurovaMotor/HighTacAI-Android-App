        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Settings]
      operationId: updateSiteSettings
      summary: Update the single-site name, address, notes, and thresholds.
      security:
        - AdminSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SiteSettingsPatch"
      responses:
        "200":
          description: Updated site settings.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /settings/network:
    get:
      tags: [Settings]
      operationId: getNetworkSettings
      summary: Return non-secret HTTP and MQTT endpoint settings.
      security:
        - AdminSession: []
      responses:
        "200":
          description: Redacted network settings.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Settings]
      operationId: updateNetworkSettings
      summary: Update non-secret bind address and port settings.
      description: Credential files and passwords are installer-managed and cannot be changed through this route.
      security:
        - AdminSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/NetworkSettingsPatch"
      responses:
        "200":
          description: Updated network settings; restart requirements are explicit in the response.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /backups:
    get:
      tags: [Backups]
      operationId: listBackups
      summary: List platform-created database backups.
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BackupStatus"
      responses:
        "200":
          description: Paginated backup records.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Backups]
      operationId: createBackup
      summary: Start an immediate SQLite online backup.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Backup started.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /backups/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Backups]
      operationId: restoreBackup
      summary: Validate and restore a platform-created database backup.
      description: A pre-restore backup is created before writes and MQTT command scheduling are paused.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
            example:
              confirmation: RESTORE BACKUP
              expected_sha256: 9e107d9d372bb6826bd81d3542a419d6e6299f6ae24c42b2762c9b6f55d25e5f
      responses:
        "202":
          description: Restore accepted; progress is reported as system.notice events until the API restarts.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /ws/events:
    get:
      tags: [Events]
      operationId: connectEventStream
      summary: Upgrade to the versioned real-time event stream.
      description: |
        Browser clients authenticate through the admin cookie. Android clients
        send the bearer token in the upgrade request. Messages conform to
        `contracts/events.schema.json`. The server does not replay event history;
        after every reconnect, clients must refresh their REST snapshots.
      security:
        - AdminSession: []
        - AndroidBearer: []
      x-websocket-message-schema: ./events.schema.json
      responses:
        "101":
          description: WebSocket protocol switched; subsequent frames are UTF-8 JSON events.
          headers:
            Upgrade:
              schema:
                type: string
                const: websocket
            Connection:
              schema:
                type: string
                const: Upgrade
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          description: A WebSocket upgrade request is required.
          headers:
            Upgrade:
              schema:
                type: string
                const: websocket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: hightac_session
      description: Opaque HttpOnly SameSite=Strict administrator session cookie.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required together with AdminSession on every mutating browser request.
    AndroidBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-token
      description: Approved installation token stored in Android Keystore; only its hash is stored server-side.
    EnrollmentPollSecret:
      type: apiKey
      in: header
      name: X-Enrollment-Secret
      description: Short-lived installation-scoped secret returned once when enrollment is created.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Number of records per page.
      schema:
        type: integer
        enum: [20, 50, 100]
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated allowlisted fields; prefix a field with `-` for descending order.
      schema:
        type: string
        maxLength: 256
        example: -updated_at
    Search:
      name: q
      in: query
      required: false
      description: Trimmed case-insensitive search text.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID. Reusing a key with the same method, path, actor,
        and normalized body returns the original result. Reusing it with a
        different request returns 409 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        format: uuid
      example: 2ec5fd45-0e4d-4be4-a6bd-3517118b64df
    StationId:
      name: station_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StationId"
    TagId:
      name: tag_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TagId"
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  headers:
    RequestId:
      description: Correlation identifier for logs and support diagnostics.
      schema:
        type: string
        format: uuid
    Location:
      description: Relative API path of the created or accepted resource.
      schema:
        type: string
        example: /api/v1/light-commands/d7d74ed4-44d7-4934-af3a-a80d93aaf63f
  responses:
    BrokerControlAccepted:
      description: Broker service control accepted. Final state arrives through the WebSocket stream.
      headers:
        Location:
          $ref: "#/components/headers/Location"
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BrokerControlOperation"
    BadRequest:
      description: Request syntax or confirmation value is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: BAD_REQUEST
              message: The request could not be processed.
              details: []
              request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
    Unauthorized:
      description: Authentication is missing, invalid, expired, or revoked.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: Valid authentication is required.
              details: []
              request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
    Forbidden:
      description: The authenticated actor lacks permission, CSRF validation failed, or the Android device is not approved.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: FORBIDDEN
              message: This actor cannot perform the requested operation.
              details: []
              request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
    NotFound:
      description: The requested resource does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: NOT_FOUND
              message: The requested resource was not found.
              details: []
              request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
    Conflict:
      description: Current resource state conflicts with the request or an idempotency key was reused for a different request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            activeBinding:
              value:
                error:
                  code: TAG_ALREADY_BOUND
                  message: The tag already has an active binding; explicit rebind is required.
                  details:
                    - field: tag_id
                      code: ACTIVE_BINDING_EXISTS
                      message: Tag AD100000048F is bound to product 1711A-OLD.
                  request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
            idempotencyMismatch:
              value:
                error:
                  code: IDEMPOTENCY_KEY_REUSED
                  message: The idempotency key belongs to a different request.
                  details: []
                  request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
            migrationPreviewMismatch:
              value:
                error:
                  code: MIGRATION_PREVIEW_MISMATCH
                  message: The preview token does not match this device and record set.
                  details: []
                  request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
            migrationPreviewStale:
              value:
                error:
                  code: MIGRATION_PREVIEW_STALE
                  message: Authoritative binding state changed after the preview.
                  details: []
                  request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
    Gone:
      description: An enrollment, one-time delivery window, or signed media link has expired.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: A request, uploaded workbook, or proxied media response exceeds its configured size limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedMediaType:
      description: Request content or a proxied media response has an unsupported media type.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: One or more path, query, header, or body values failed validation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: VALIDATION_ERROR
              message: One or more values are invalid.
              details:
                - field: tag_id
                  code: PATTERN_MISMATCH
                  message: Must match ^AD1[0-9A-F]{9}$.
              request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds before another attempt.
          schema:
            type: integer
            minimum: 1
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required platform component such as the MQTT bridge or Windows service controller is unavailable.
      headers:
        Retry-After:
          description: Suggested retry delay in seconds.
          schema:
            type: integer
            minimum: 1
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: MQTT_UNAVAILABLE
              message: The broker is not available; no command was created.
              details: []
              request_id: b6d35a55-63ac-4b0e-99ae-78262b27c7da
    BadGateway:
      description: The configured third-party service failed or rejected its server credential.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GatewayTimeout:
      description: The configured third-party service did not respond before the server timeout.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InsufficientStorage:
      description: The platform data volume lacks space for the backup or pre-restore copy.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    MobileProxyJsonObject:
      type: object
      description: Provider-defined JSON with server-managed credentials omitted.
      additionalProperties: true
    Uuid:
      type: string
      format: uuid
      example: 2b16ae29-f7ab-4c44-9fc6-a0ca693d9c68
    Timestamp:
      type: string
      format: date-time
      example: "2026-07-16T08:15:30Z"
    StationId:
      type: string
      pattern: ^90A9F[0-9A-F]{7}$
      example: 90A9F1234567
    TagId:
      type: string
      pattern: ^AD1[0-9A-F]{9}$
      example: AD100000048F
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
      example: 9e107d9d372bb6826bd81d3542a419d6e6299f6ae24c42b2762c9b6f55d25e5f
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        message:
          type: string
          minLength: 1
          maxLength: 1024
        details:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ErrorDetail"
        request_id:
          $ref: "#/components/schemas/Uuid"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: [string, "null"]
          maxLength: 256
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        message:
          type: string
          minLength: 1
          maxLength: 1024
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          enum: [20, 50, 100]
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, must_change_password, is_active, created_at, last_login_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        username:
          type: string
          minLength: 1
          maxLength: 64
          example: Adam
        must_change_password:
          type: boolean
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_login_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, csrf_token, session_expires_at]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        csrf_token:
          type: string
          minLength: 32
          maxLength: 256
          description: Non-cookie token sent as X-CSRF-Token on mutating admin requests.
        session_expires_at:
          $ref: "#/components/schemas/Timestamp"
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
    ConfirmationRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          minLength: 1
          maxLength: 64
    Liveness:
      type: object
      additionalProperties: false
      required: [status, service, version, checked_at]
      properties:
        status:
          type: string
          const: alive
        service:
          type: string
          const: HighTacPlatform
        version:
          type: string
          minLength: 1
          maxLength: 64
        checked_at:
          $ref: "#/components/schemas/Timestamp"
    CheckStatus:
      type: string
      enum: [READY, DEGRADED, NOT_READY]
    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status, message, checked_at]
      properties:
        name:
          type: string
          enum: [database, migrations, mqtt_bridge]
        status:
          $ref: "#/components/schemas/CheckStatus"
        message:
          type: string
          maxLength: 512
        checked_at:
          $ref: "#/components/schemas/Timestamp"
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks, checked_at]
      properties:
        status:
          $ref: "#/components/schemas/CheckStatus"
        checks:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ReadinessCheck"
        checked_at:
          $ref: "#/components/schemas/Timestamp"
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        - api_status
        - broker
        - station_counts
        - tag_counts
        - product_counts
        - command_counts_24h
        - device_counts
        - recent_incidents
        - recent_operations
        - generated_at
      properties:
        api_status:
          $ref: "#/components/schemas/CheckStatus"
        broker:
          $ref: "#/components/schemas/BrokerStatus"
        station_counts:
          $ref: "#/components/schemas/StationCounts"
        tag_counts:
          $ref: "#/components/schemas/TagCounts"
        product_counts:
          $ref: "#/components/schemas/ProductCounts"
        command_counts_24h:
          $ref: "#/components/schemas/CommandCounts"
        device_counts:
          $ref: "#/components/schemas/DeviceCounts"
        recent_incidents:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DashboardIncident"
        recent_operations:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/OperationLog"
        generated_at:
          $ref: "#/components/schemas/Timestamp"
    StationCounts:
      type: object
      additionalProperties: false
      required: [total, online, stale, offline, unknown]
      properties:
        total: {type: integer, minimum: 0}
        online: {type: integer, minimum: 0}
        stale: {type: integer, minimum: 0}
        offline: {type: integer, minimum: 0}
        unknown: {type: integer, minimum: 0}
    TagCounts:
      type: object
      additionalProperties: false
      required: [total, discovered_24h, low_battery, abnormal, unbound]
      properties:
        total: {type: integer, minimum: 0}
        discovered_24h: {type: integer, minimum: 0}
        low_battery: {type: integer, minimum: 0}
        abnormal: {type: integer, minimum: 0}
        unbound: {type: integer, minimum: 0}
    ProductCounts:
      type: object
      additionalProperties: false
      required: [total, active_bindings]
      properties:
        total: {type: integer, minimum: 0}
        active_bindings: {type: integer, minimum: 0}
    CommandCounts:
      type: object
      additionalProperties: false
      required: [total, confirmed, partially_confirmed, unconfirmed, failed, confirmation_rate]
      properties:
        total: {type: integer, minimum: 0}
        confirmed: {type: integer, minimum: 0}
        partially_confirmed: {type: integer, minimum: 0}
        unconfirmed: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        confirmation_rate: {type: number, minimum: 0, maximum: 1}
    DeviceCounts:
      type: object
      additionalProperties: false
      required: [pending, approved, revoked, online]
      properties:
        pending: {type: integer, minimum: 0}
        approved: {type: integer, minimum: 0}
        revoked: {type: integer, minimum: 0}
        online: {type: integer, minimum: 0}
    DashboardIncident:
      type: object
      additionalProperties: false
      required: [id, severity, code, message, entity_type, entity_id, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        severity:
          type: string
          enum: [INFO, WARNING, ERROR]
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        message:
          type: string
          minLength: 1
          maxLength: 1024
        entity_type:
          type: string
          maxLength: 64
        entity_id:
          type: [string, "null"]
          maxLength: 128
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
    DashboardTrendPoint:
      type: object
      additionalProperties: false
      required: [bucket_start, commands, confirmed, tags_discovered, incidents]
      properties:
        bucket_start:
          $ref: "#/components/schemas/Timestamp"
        commands: {type: integer, minimum: 0}
        confirmed: {type: integer, minimum: 0}
        tags_discovered: {type: integer, minimum: 0}
        incidents: {type: integer, minimum: 0}
    DashboardTrends:
      type: object
      additionalProperties: false
      required: [range, bucket_seconds, points, generated_at]
      properties:
        range:
          type: string
          enum: [24h, 7d]
        bucket_seconds:
          type: integer
          minimum: 1
        points:
          type: array
          items:
            $ref: "#/components/schemas/DashboardTrendPoint"
        generated_at:
          $ref: "#/components/schemas/Timestamp"
    BrokerServiceState:
      type: string
      enum: [STOPPED, STARTING, RUNNING, STOPPING, FAILED, UNKNOWN]
    BrokerStatus:
      type: object
      additionalProperties: false
      required:
        - service_name
        - service_state
        - endpoint
        - tcp_reachable
        - mqtt_connected
        - subscriptions_ready
        - started_at
        - uptime_seconds
        - checked_at
      properties:
        service_name:
          type: string
          const: HighTacMqttBroker
        service_state:
          $ref: "#/components/schemas/BrokerServiceState"
        endpoint:
          type: string
          pattern: ^[^\s:]+:\d{1,5}$
          example: 192.168.1.105:1884
        tcp_reachable:
          type: boolean
        mqtt_connected:
          type: boolean
        subscriptions_ready:
          type: boolean
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        uptime_seconds:
          type: [integer, "null"]
          minimum: 0
        checked_at:
          $ref: "#/components/schemas/Timestamp"
    BrokerControlOperation:
      type: object
      additionalProperties: false
      required: [id, action, status, requested_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        action:
          type: string
          enum: [START, STOP, RESTART]
        status:
          type: string
          enum: [ACCEPTED, RUNNING, SUCCEEDED, FAILED]
        requested_at:
          $ref: "#/components/schemas/Timestamp"
    BrokerLogs:
      type: object
      additionalProperties: false
      required: [service_name, requested_lines, returned_lines, lines, truncated, read_at]
      properties:
        service_name:
          type: string
          const: HighTacMqttBroker
        requested_lines:
          type: integer
          enum: [50, 200, 500]
        returned_lines:
          type: integer
          minimum: 0
          maximum: 500
        lines:
          type: array
          maxItems: 500
          items:
            type: string
            maxLength: 4096
        truncated:
          type: boolean
        read_at:
          $ref: "#/components/schemas/Timestamp"
    BrokerConfigSummary:
      type: object
      additionalProperties: false
      required: [service_name, listener_host, listener_port, tls_enabled, anonymous_enabled, persistence_enabled, backend_username, station_account_count]
      properties:
        service_name:
          type: string
          const: HighTacMqttBroker
        listener_host:
          type: string
          minLength: 1
          maxLength: 255
        listener_port:
          type: integer
          minimum: 1
          maximum: 65535
        tls_enabled:
          type: boolean
        anonymous_enabled:
          type: boolean
          const: false
        persistence_enabled:
          type: boolean
        backend_username:
          type: string
          minLength: 1
          maxLength: 128
          description: Username only; no password or hash is exposed.
        station_account_count:
          type: integer
          minimum: 0
    StationStatus:
      type: string
      enum: [UNKNOWN, ONLINE, STALE, OFFLINE]
    StationCreate:
      type: object
      additionalProperties: false
      required: [station_id, site_id]
      properties:
        station_id:
          $ref: "#/components/schemas/StationId"
        site_id:
          $ref: "#/components/schemas/Uuid"
        alias:
          type: [string, "null"]
          maxLength: 128
    StationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        alias:
          type: [string, "null"]
          maxLength: 128
    Station:
      type: object
      additionalProperties: false
      required:
        - station_id
        - site_id
        - alias
        - status
        - mac
        - firmware_version
        - server_address
        - heartbeat_seconds
        - last_heartbeat_at
        - total_count
        - send_count
        - broker_connected
        - created_at
        - updated_at
      properties:
        station_id:
          $ref: "#/components/schemas/StationId"
        site_id:
          $ref: "#/components/schemas/Uuid"
        alias:
          type: [string, "null"]
          maxLength: 128
        status:
          $ref: "#/components/schemas/StationStatus"
        mac:
          type: [string, "null"]
          maxLength: 64
        firmware_version:
          type: [string, "null"]
          maxLength: 64
        server_address:
          type: [string, "null"]
          maxLength: 255
        heartbeat_seconds:
          type: [integer, "null"]
          minimum: 1
          maximum: 3600
        last_heartbeat_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        total_count:
          type: integer
          minimum: 0
        send_count:
          type: integer
          minimum: 0
        broker_connected:
          type: boolean
          description: Separates backend MQTT connectivity from station liveness.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    StationPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Station"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    ConnectionChecklistItem:
      type: object
      additionalProperties: false
      required: [key, label, value, sensitive, status]
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        label:
          type: string
          minLength: 1
          maxLength: 128
        value:
          type: string
          maxLength: 512
        sensitive:
          type: boolean
        status:
          type: string
          enum: [READY, ACTION_REQUIRED, NOT_APPLICABLE]
    ConnectionChecklist:
      type: object
      additionalProperties: false
      required: [station_id, items, generated_at]
      properties:
        station_id:
          $ref: "#/components/schemas/StationId"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConnectionChecklistItem"
        generated_at:
          $ref: "#/components/schemas/Timestamp"
    BatteryLevel:
      type: [integer, "null"]
      enum: [0, 10, 30, 60, 80, 90, 100, null]
    Tag:
      type: object
      additionalProperties: false
      required:
        - tag_id
        - site_id
        - station_id
        - registered_at
        - first_seen_at
        - last_seen_at
        - online
        - battery_raw
        - battery_voltage
        - battery_level
        - low_battery
        - firmware_version
        - group_no
        - last_result_type
        - is_abnormal
        - abnormal_reason
        - active_binding_id
      properties:
        tag_id:
          $ref: "#/components/schemas/TagId"
        site_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        station_id:
          oneOf:
            - $ref: "#/components/schemas/StationId"
            - type: "null"
        registered_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        first_seen_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        last_seen_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        online:
          type: boolean
        battery_raw:
          type: [integer, "null"]
          minimum: 0
        battery_voltage:
          type: [number, "null"]
          minimum: 0
        battery_level:
          $ref: "#/components/schemas/BatteryLevel"
        low_battery:
          type: boolean
        firmware_version:
          type: [string, "null"]
          maxLength: 64
        group_no:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
        last_result_type:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
        is_abnormal:
          type: boolean
        abnormal_reason:
          type: [string, "null"]
          maxLength: 512
        active_binding_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
    TagStatusHistoryItem:
      type: object
      additionalProperties: false
      required: [id, occurred_at, online, battery_raw, battery_level, result_type, is_abnormal, abnormal_reason]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        online:
          type: boolean
        battery_raw:
          type: [integer, "null"]
          minimum: 0
        battery_level:
          $ref: "#/components/schemas/BatteryLevel"
        result_type:
          type: [integer, "null"]
          minimum: 0
          maximum: 255
        is_abnormal:
          type: boolean
        abnormal_reason:
          type: [string, "null"]
          maxLength: 512
    TagDetail:
      type: object
      additionalProperties: false
      required: [tag, active_binding, recent_history]
      properties:
        tag:
          $ref: "#/components/schemas/Tag"
        active_binding:
          oneOf:
            - $ref: "#/components/schemas/Binding"
            - type: "null"
        recent_history:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TagStatusHistoryItem"
    TagRegister:
      type: object
      additionalProperties: false
      required: [tag_id, station_id]
      properties:
        tag_id:
          $ref: "#/components/schemas/TagId"
        station_id:
          $ref: "#/components/schemas/StationId"
    TagPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    ProductSource:
      type: string
      enum: [BINDING, EXCEL]
    ProductCode:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^\S(?:.*\S)?$
      description: Trimmed and uppercased before uniqueness checks.
      example: 1711A-ABA-PT
    ProductCreate:
      type: object
      additionalProperties: false
      required: [product_code]
      properties:
        product_code:
          $ref: "#/components/schemas/ProductCode"
        product_name:
          type: [string, "null"]
          maxLength: 256
    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        product_name:
          type: [string, "null"]
          maxLength: 256
        is_active:
          type: boolean
    Product:
      type: object
      additionalProperties: false
      required: [id, product_code, product_name, source, is_active, active_binding_count, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        product_code:
          $ref: "#/components/schemas/ProductCode"
        product_name:
          type: [string, "null"]
          maxLength: 256
        source:
          $ref: "#/components/schemas/ProductSource"
        is_active:
          type: boolean
        active_binding_count:
          type: integer
          minimum: 0
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    ProductDetail:
      type: object
      additionalProperties: false
      required: [product, active_bindings]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        active_bindings:
          type: array
          items:
            $ref: "#/components/schemas/Binding"
    ProductPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    ImportStatus:
      type: string
      enum: [UPLOADED, VALIDATING, READY, INVALID, COMMITTING, COMMITTED, FAILED]
    ImportRowError:
      type: object
      additionalProperties: false
      required: [row_number, field, code, message, value]
      properties:
        row_number:
          type: integer
          minimum: 2
        field:
          type: string
          enum: [product_code, product_name, workbook]
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
        message:
          type: string
          minLength: 1
          maxLength: 1024
        value:
          type: [string, number, boolean, "null"]
    ImportJob:
      type: object
      additionalProperties: false
      required:
        - id
        - filename
        - status
        - total_rows
        - valid_rows
        - error_rows
        - errors
        - errors_truncated
        - created_at
        - validated_at
        - committed_at
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        filename:
          type: string
          minLength: 1
          maxLength: 255
        status:
          $ref: "#/components/schemas/ImportStatus"
        total_rows:
          type: integer
          minimum: 0
        valid_rows:
          type: integer
          minimum: 0
        error_rows:
          type: integer
          minimum: 0
        errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ImportRowError"
        errors_truncated:
          type: boolean
        created_at:
          $ref: "#/components/schemas/Timestamp"
        validated_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        committed_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    BindingSource:
      type: string
      enum: [ANDROID, WEB, MIGRATION]
    ActorType:
      type: string
      enum: [ADMIN, ANDROID, SYSTEM]
    BindingCreate:
      type: object
      additionalProperties: false
