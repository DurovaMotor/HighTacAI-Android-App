            $ref: "#/components/schemas/Timestamp"
      responses:
        "200":
          description: Audit export in the selected format.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="hightac-operation-logs.csv"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
