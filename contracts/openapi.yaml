        device-enrollment secret and expires after a short interval. This GET
        intentionally does not require an Android Authorization header so image
        loaders can use it directly. The server accepts only HTTPS media URLs
        on the exact `files.jiandaoyun.com` host, does not follow redirects, and
        returns only bounded `image/*` responses.
      security: []
      parameters:
