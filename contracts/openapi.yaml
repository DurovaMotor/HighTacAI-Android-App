        records:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            $ref: "#/components/schemas/AndroidBindingMigrationPreviewRecord"
    AndroidBindingMigrationCommitRequest:
      type: object
      additionalProperties: false
      required: [records, preview_token, selected_duplicate_keys]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 2000
          description: Exact ordered normalized records used for the preview.
          items:
