          type: integer
          minimum: 1
          maximum: 2000
        migratable:
          type: integer
          minimum: 0
          maximum: 2000
        identical:
          type: integer
          minimum: 0
          maximum: 2000
        duplicate_legacy_tag:
          type: integer
          minimum: 0
          maximum: 2000
        tag_bound_to_different_product:
          type: integer
          minimum: 0
          maximum: 2000
        station_mismatch:
          type: integer
          minimum: 0
          maximum: 2000
        station_not_found:
          type: integer
          minimum: 0
          maximum: 2000
    AndroidBindingMigrationPreviewToken:
      type: string
      minLength: 32
      maxLength: 2048
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      description: Integrity-protected stateless token bound to device, records, and relevant authoritative state.
    AndroidBindingMigrationPreview:
      type: object
      additionalProperties: false
      required: [preview_token, summary, records]
      properties:
        preview_token:
          $ref: "#/components/schemas/AndroidBindingMigrationPreviewToken"
        summary:
