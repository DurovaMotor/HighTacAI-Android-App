    AndroidBindingMigrationClientRecordKey:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^\S(?:.*\S)?$'
      description: |
        Opaque deterministic identity for one persisted legacy record. Android
        must derive it from stable local record identity plus normalized tag,
        product, and station values and reuse it unchanged for preview, commit,
        duplicate selection, and retries.
      example: 27ee8d94-71fb-40a4-8a2b-c399621a8fb5|AD100000048F|1711A-ABA-PT|90A9F1234567
    AndroidBindingMigrationTagIdInput:
      type: string
      minLength: 9
      maxLength: 12
      pattern: '^(?:[Aa][Dd]1)?[0-9A-Fa-f]{9}$'
      description: A full or legacy nine-hex tag ID; the server returns canonical uppercase AD1 form.
      example: 00000048F
    AndroidBindingMigrationStationIdInput:
      type: string
      minLength: 12
      maxLength: 12
      pattern: '^90[Aa]9[Ff][0-9A-Fa-f]{7}$'
      description: Canonicalized to uppercase before preview hashing.
      example: 90A9F1234567
    AndroidBindingMigrationRecord:
      type: object
      additionalProperties: false
      required: [client_record_key, product_code, tag_id, station_id]
      properties:
        client_record_key:
          $ref: "#/components/schemas/AndroidBindingMigrationClientRecordKey"
        product_code:
          $ref: "#/components/schemas/ProductCode"
        product_name:
          type: [string, "null"]
          maxLength: 256
        tag_id:
          $ref: "#/components/schemas/AndroidBindingMigrationTagIdInput"
        station_id:
          $ref: "#/components/schemas/AndroidBindingMigrationStationIdInput"
    AndroidBindingMigrationPreviewRequest:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 2000
          description: Ordered normalized records with unique client_record_key values.
          items:
            $ref: "#/components/schemas/AndroidBindingMigrationRecord"
    AndroidBindingMigrationClassification:
      type: string
      enum:
        - MIGRATABLE
        - IDENTICAL
        - DUPLICATE_LEGACY_TAG
        - TAG_BOUND_TO_DIFFERENT_PRODUCT
        - STATION_MISMATCH
        - STATION_NOT_FOUND
    AndroidBindingMigrationPreviewRecord:
      type: object
      additionalProperties: false
      required:
        - client_record_key
        - product_code
        - product_name
        - tag_id
        - station_id
        - classification
        - authoritative_binding_id
        - authoritative_product_code
        - authoritative_station_id
      properties:
        client_record_key:
          $ref: "#/components/schemas/AndroidBindingMigrationClientRecordKey"
        product_code:
          $ref: "#/components/schemas/ProductCode"
        product_name:
          type: [string, "null"]
          maxLength: 256
        tag_id:
          $ref: "#/components/schemas/TagId"
        station_id:
          $ref: "#/components/schemas/StationId"
        classification:
          $ref: "#/components/schemas/AndroidBindingMigrationClassification"
        authoritative_binding_id:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        authoritative_product_code:
          oneOf:
            - $ref: "#/components/schemas/ProductCode"
            - type: "null"
        authoritative_station_id:
          oneOf:
            - $ref: "#/components/schemas/StationId"
            - type: "null"
    AndroidBindingMigrationPreviewSummary:
      type: object
      additionalProperties: false
      required:
        - total_records
        - migratable
        - identical
        - duplicate_legacy_tag
        - tag_bound_to_different_product
        - station_mismatch
        - station_not_found
      properties:
