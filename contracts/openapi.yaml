openapi: 3.1.0
info:
  title: HighTac Local Platform API
  version: 2.0.0
  summary: Contract for the HighTac LAN management platform.
  description: |
    The Windows backend is the source of truth for stations, tags, products,
    bindings, commands, devices, and audit records. Timestamps are RFC 3339 UTC.

    Admin browser requests use the `hightac_session` cookie. Every mutating
    admin request also requires `X-CSRF-Token`. Approved Android installations
    use bearer identity and never receive MQTT credentials. The canonical retry
    key for retry-safe writes is the `Idempotency-Key` header; keys are scoped to
    the authenticated principal and retained for at least 24 hours.

    Approved Android devices also use bearer-authenticated, allowlisted mobile
    proxies for OpenAI-compatible Responses and JianDaoYun catalog reads. Third-
    party API credentials remain server-side and are never returned to clients.
  contact:
    name: HighTac Engineering
  license:
    name: Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://{host}:{port}/api/v1
    description: HighTac platform on the trusted local network
    variables:
      host:
        default: 192.168.1.105
      port:
        default: "8088"
tags:
  - name: Authentication
  - name: Health
  - name: Dashboard
  - name: Broker
  - name: Stations
  - name: Tags
  - name: Products
  - name: Imports
  - name: Bindings
  - name: Migrations
  - name: Commands
  - name: Mobile proxy
  - name: Device enrollments
  - name: Android devices
  - name: Operation logs
  - name: Settings
  - name: Backups
  - name: Events

paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginAdmin
      summary: Log in as the single site administrator.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              development:
                summary: Example administrator credentials; not a runtime account
                value:
                  username: example-admin
                  password: example-only-not-a-runtime-password
      responses:
        "200":
          description: Login succeeded. The session identifier is returned only as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: HttpOnly, SameSite=Strict admin session cookie.
              schema:
                type: string
                example: hightac_session=opaque; HttpOnly; SameSite=Strict; Path=/
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutAdmin
      summary: Revoke the current admin session.
      security:
        - AdminSession: []
          CsrfToken: []
      responses:
        "204":
          description: Session revoked.
          headers:
            Set-Cookie:
              description: Expired admin session cookie.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAdmin
      summary: Return the current administrator.
      security:
        - AdminSession: []
      responses:
        "200":
          description: Current administrator.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/change-password:
    post:
      tags: [Authentication]
      operationId: changeAdminPassword
      summary: Change the current administrator password.
      security:
        - AdminSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and other sessions revoked.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Report whether the API process is alive.
      security: []
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Report database, migrations, and MQTT bridge readiness.
      security: []
      responses:
        "200":
          description: All required components are ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: One or more required components are not ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: Return the current platform snapshot and operational counts.
      security:
        - AdminSession: []
        - AndroidBearer: []
      responses:
        "200":
          description: Current dashboard snapshot.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard/trends:
    get:
      tags: [Dashboard]
      operationId: getDashboardTrends
      summary: Return command, discovery, and incident trend buckets.
      security:
        - AdminSession: []
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d]
            default: 24h
      responses:
        "200":
          description: Trend buckets in chronological order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardTrends"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /broker/status:
    get:
      tags: [Broker]
      operationId: getBrokerStatus
      summary: Return Windows service, TCP, and backend MQTT status.
      security:
        - AdminSession: []
        - AndroidBearer: []
      responses:
        "200":
          description: Broker status snapshot.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /broker/start:
    post:
      tags: [Broker]
      operationId: startBroker
      summary: Start the fixed HighTacMqttBroker Windows service.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/BrokerControlAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /broker/stop:
    post:
      tags: [Broker]
      operationId: stopBroker
      summary: Stop the fixed HighTacMqttBroker Windows service.
      description: The caller must present an explicit confirmation phrase. The API remains available while the broker is stopped.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationRequest"
            example:
              confirmation: STOP BROKER
      responses:
        "202":
          $ref: "#/components/responses/BrokerControlAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /broker/restart:
    post:
      tags: [Broker]
      operationId: restartBroker
      summary: Restart the fixed HighTacMqttBroker Windows service.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/BrokerControlAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /broker/logs:
    get:
      tags: [Broker]
      operationId: getBrokerLogs
      summary: Return a bounded tail of the configured Mosquitto log.
      description: The endpoint accepts no file path and redacts credential-like values.
      security:
        - AdminSession: []
      parameters:
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            enum: [50, 200, 500]
            default: 200
      responses:
        "200":
          description: Bounded broker log tail.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerLogs"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /broker/config-summary:
    get:
      tags: [Broker]
      operationId: getBrokerConfigSummary
      summary: Return a redacted broker configuration summary.
      security:
        - AdminSession: []
      responses:
        "200":
          description: Broker configuration without passwords or password-file content.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerConfigSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /stations:
    get:
      tags: [Stations]
      operationId: listStations
      summary: List stations using server-side filtering and pagination.
      security:
        - AdminSession: []
        - AndroidBearer: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Search"
        - name: site_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/StationStatus"
      responses:
        "200":
          description: Paginated stations.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Stations]
      operationId: createStation
      summary: Add a station to the site inventory.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StationCreate"
            example:
              station_id: 90A9F1234567
              site_id: 2b16ae29-f7ab-4c44-9fc6-a0ca693d9c68
              alias: Receiving Dock
      responses:
        "201":
          description: Station created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /stations/{station_id}:
    parameters:
      - $ref: "#/components/parameters/StationId"
    get:
      tags: [Stations]
      operationId: getStation
      summary: Return station details and current connectivity state.
      security:
        - AdminSession: []
        - AndroidBearer: []
      responses:
        "200":
          description: Station details.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Stations]
      operationId: updateStation
      summary: Update the administrator-managed station alias.
      security:
        - AdminSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/StationPatch"
            example:
              alias: Front Warehouse
      responses:
        "200":
          description: Updated station.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /stations/{station_id}/connection-checklist:
    parameters:
      - $ref: "#/components/parameters/StationId"
    get:
      tags: [Stations]
      operationId: getStationConnectionChecklist
      summary: Generate a redacted station onboarding checklist.
      description: Credentials are never returned; the checklist identifies the installer-managed credential slot only.
      security:
        - AdminSession: []
      responses:
        "200":
          description: Station connection checklist.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionChecklist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List light tags using server-side filtering and pagination.
      security:
        - AdminSession: []
        - AndroidBearer: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Search"
        - name: site_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: station_id
          in: query
          schema:
            $ref: "#/components/schemas/StationId"
        - name: online
          in: query
          schema:
            type: boolean
        - name: low_battery
          in: query
          schema:
            type: boolean
        - name: abnormal
          in: query
          schema:
            type: boolean
        - name: bound
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated light tags.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/TagId"
    get:
      tags: [Tags]
      operationId: getTag
      summary: Return a light tag, its active binding, and recent status history.
      security:
        - AdminSession: []
        - AndroidBearer: []
      responses:
        "200":
          description: Light tag details.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tags/register:
    post:
      tags: [Tags]
      operationId: registerTag
      summary: Manually register a known light tag.
      security:
        - AdminSession: []
          CsrfToken: []
        - AndroidBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRegister"
            example:
              tag_id: AD100000048F
              station_id: 90A9F1234567
      responses:
        "201":
          description: Tag registered.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tags/low-battery:
    get:
      tags: [Tags]
      operationId: listLowBatteryTags
      summary: List tags at or below the configured low-battery threshold.
      security:
        - AdminSession: []
        - AndroidBearer: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - name: station_id
          in: query
          schema:
            $ref: "#/components/schemas/StationId"
      responses:
        "200":
          description: Paginated low-battery tags.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tags/abnormal:
    get:
      tags: [Tags]
      operationId: listAbnormalTags
      summary: List tags currently marked abnormal.
      security:
        - AdminSession: []
        - AndroidBearer: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - name: station_id
          in: query
          schema:
            $ref: "#/components/schemas/StationId"
      responses:
        "200":
          description: Paginated abnormal tags.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products and active-binding counts.
      security:
        - AdminSession: []
        - AndroidBearer: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Search"
        - name: product_code
          in: query
          schema:
            type: string
            maxLength: 128
        - name: product_name
          in: query
          schema:
            type: string
            maxLength: 256
        - name: tag_id
          in: query
          schema:
            $ref: "#/components/schemas/TagId"
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/ProductSource"
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated products.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
            example:
              product_code: 1711A-ABA-PT
              product_name: HighTac sample product
      responses:
        "201":
          description: Product created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Products]
      operationId: getProduct
      summary: Return a product and all current tag bindings.
      security:
        - AdminSession: []
        - AndroidBearer: []
      responses:
        "200":
          description: Product details.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Update product name or active state.
      security:
        - AdminSession: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: Updated product.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /products/import-template:
    get:
      tags: [Imports]
      operationId: downloadProductImportTemplate
      summary: Download the product import workbook template.
      security:
        - AdminSession: []
      responses:
        "200":
          description: Excel workbook with Product Code required and Product Name optional.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="hightac-product-import.xlsx"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                contentEncoding: binary
        "401":
