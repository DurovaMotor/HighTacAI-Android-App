              model: Field-10
              app_version: 2.0.0
      responses:
        "202":
          description: >-
            Enrollment was processed. A fresh enrollment is APPROVED and
            returns its device bearer token once. Idempotent replays preserve
            APPROVED, REJECTED, or EXPIRED status but do not disclose an
            already-issued token. Clients recover a lost one-time response by
            submitting a new idempotency challenge.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEnrollmentCreated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /device-enrollments/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Device enrollments]
      operationId: getDeviceEnrollment
      summary: Poll enrollment state and receive an automatically authorized device token once.
      description: >-
        The poll secret is installation-scoped and is replaced by Android
        bearer identity after authorization. Polling automatically advances
        PENDING records retained from manual-approval releases. Revoked
        enrollments remain rejected.
      security:
        - EnrollmentPollSecret: []
      responses:
        "200":
          description: Current enrollment state. `device_token` appears only on the first approved response.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEnrollmentStatus"
              examples:
                upgradedPending:
                  value:
                    id: 88f22b30-f160-4446-b793-883628620243
                    status: APPROVED
                    display_name: null
                    device_id: ba17796c-c44e-4dc5-9afc-e82af7ef0cf1
                    device_token: htdev_fixture_token_returned_once
                    expires_at: "2026-07-17T08:15:30Z"
                approvedOnce:
                  value:
                    id: 88f22b30-f160-4446-b793-883628620243
                    status: APPROVED
                    display_name: Receiving Phone
                    device_id: ba17796c-c44e-4dc5-9afc-e82af7ef0cf1
                    device_token: htdev_fixture_token_returned_once
                    expires_at: "2026-07-17T08:15:30Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /android-devices:
    get:
      tags: [Android devices]
      operationId: listAndroidDevices
      summary: List pending, approved, and revoked Android installations.
      security:
        - AdminSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeviceStatus"
      responses:
        "200":
          description: Paginated Android installations.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AndroidDevicePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /android-devices/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Android devices]
      operationId: approveAndroidDevice
      summary: Approve a pending Android installation and assign its display name.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRename"
            example:
              display_name: Receiving Phone
      responses:
        "200":
          description: Approved Android installation. The bearer token is delivered only through enrollment polling.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AndroidDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /android-devices/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Android devices]
      operationId: revokeAndroidDevice
      summary: Revoke an Android installation and its bearer token.
      security:
        - AdminSession: []
          CsrfToken: []
      parameters:
