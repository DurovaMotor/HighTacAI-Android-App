      type: string
      enum: [LIGHT_ON, LIGHT_OFF]
    LightColor:
      type: string
      enum: [RED, GREEN, BLUE, CYAN, PINK]
    CommandStatus:
      type: string
      enum: [ACCEPTED, PUBLISHED, CONFIRMED, PARTIALLY_CONFIRMED, UNCONFIRMED, FAILED, SUPERSEDED]
    CommandItemStatus:
      type: string
      enum: [PENDING, PUBLISHED, CONFIRMED, UNCONFIRMED, FAILED, SUPERSEDED]
    LightCommandCreate:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/LightAction"
        product_code:
          $ref: "#/components/schemas/ProductCode"
        tag_ids:
          type: array
          minItems: 1
          maxItems: 2000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TagId"
        color:
          $ref: "#/components/schemas/LightColor"
      oneOf:
        - required: [product_code]
          not:
            required: [tag_ids]
        - required: [tag_ids]
          not:
            required: [product_code]
      allOf:
        - if:
            properties:
              action:
                const: LIGHT_ON
            required: [action]
          then:
            required: [color]
        - if:
            properties:
              action:
                const: LIGHT_OFF
            required: [action]
          then:
            not:
              required: [color]
    CommandItem:
      type: object
